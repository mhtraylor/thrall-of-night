name: Deploy Godot Web QA Build
run-name: ${{ github.actor }} deploying QA build
on:
  push:
    branches: [ qa ]
    tags: [ 'v*' ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # Determine build version
      - name: Version 
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="qa-$(date +%Y%m%d-%H%M%S)-${{ github.sha }}"
            VERSION="${VERSION:0:30}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Build version: $VERSION"

      # Add version info to project
      - name: Add version
        run: |
          cat > ./override.cfg << 'EOF'
          application/config/version="${{ steps.version.outputs.version }}"
          EOF
          
      # Create build dir
      - name: Create build dir
        run: mkdir -p ./build

      # Export Godot build
      - name: Export 
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://downloads.godotengine.org/?version=4.7.1&flavor=stable&slug=linux.x86_64.zip&platform=linux.64
          godot_export_templates_download_url: https://downloads.godotengine.org/?version=4.7.1&flavor=stable&slug=export_templates.tpz&platform=templates 
          relative_project_path: ./
          cache: true
          export_debug: true
          # use_preset_export_path: true
          relative_export_path: ./build
          verbose: true
          presets_to_export: web

      # Verify build output
      - name: Verify build
        run: |
          ls -lahR ./build
          test -f ./build/web/index.html || exit 1

      # Add coi-service-worker
      - name: Add coi-service-worker
        run: |
          curl -H 'Accept: application/vnd.github.v3.raw' -sS -O --output-dir ./build/web -L https://raw.githubusercontent.com/gzuidhof/coi-serviceworker/refs/heads/master/coi-serviceworker.min.js
          test -f ./build/web/coi-serviceworker.min.js || exit 1
          sed -i '3 i <script src="coi-serviceworker.min.js"></script>' ./build/web/index.html

      # Upload artifact
      - name: Upload
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/web
          
  # Deploy build to Github Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
